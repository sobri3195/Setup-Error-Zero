<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup-Error Zero</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      body { font-family: Arial, sans-serif; margin: 0; background: #f4f8ff; color: #111; }
      .page { max-width: 920px; margin: 0 auto; padding: 1.2rem; min-height: 100vh; }
      .card { background: #fff; padding: 1.2rem 1.4rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
      h1 { margin-top: 0; margin-bottom: .5rem; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: .8rem; }
      label { font-size: .9rem; color: #333; display: flex; flex-direction: column; gap: .3rem; }
      input { padding: .55rem; border-radius: 8px; border: 1px solid #cfd7e6; }
      button { margin-top: 1rem; padding: .65rem 1rem; border: 0; border-radius: 8px; background: #2d5bff; color: #fff; cursor: pointer; }
      .result { margin-top: 1rem; background: #f8fbff; border: 1px solid #d6e4ff; border-radius: 8px; padding: .8rem; }
      .muted { color: #666; font-size: .9rem; }
      .panel { display: none; }
      .panel.active { display: block; }
      .empty-state { margin-top: 1rem; border: 1px dashed #cfd7e6; border-radius: 8px; padding: 1rem; color: #666; background: #fcfdff; }
      .mobile-nav { display: none; }

      @media (max-width: 768px) {
        .page { padding: .8rem .8rem 5.5rem; }
        .card { padding: 1rem; border-radius: 14px; }
        .grid { grid-template-columns: 1fr 1fr; gap: .6rem; }
        button { width: 100%; }
        .mobile-nav {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: .4rem;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 99;
          background: #fff;
          border-top: 1px solid #dce6ff;
          padding: .6rem .8rem calc(.6rem + env(safe-area-inset-bottom));
          box-shadow: 0 -2px 14px rgba(0,0,0,.08);
        }
        .nav-btn {
          border: 1px solid #d8e4ff;
          border-radius: 10px;
          background: #f8fbff;
          color: #345;
          padding: .6rem .5rem;
          font-size: .82rem;
          margin-top: 0;
        }
        .nav-btn.active {
          background: #2d5bff;
          color: #fff;
          border-color: #2d5bff;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [form, setForm] = useState({ tx_mm: 0, ty_mm: 0, tz_mm: 0, rx_deg: 0, ry_deg: 0, rz_deg: 0 });
        const [result, setResult] = useState(null);
        const [activeTab, setActiveTab] = useState('input');

        const update = (key, value) => setForm(prev => ({ ...prev, [key]: Number(value) }));

        const submit = async () => {
          const res = await fetch('/api/recommend', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(form)
          });
          setResult(await res.json());
        };

        return (
          <div className="page">
            <div className="card">
              <h1>Setup-Error Zero</h1>
              <p className="muted">AI deteksi translasi/rotasi dan rekomendasi koreksi setup real-time dari portal imaging/CBCT.</p>

              <div className={`panel ${activeTab === 'input' ? 'active' : ''}`}>
                <div className="grid">
                  <label>Tx (mm)<input type="number" value={form.tx_mm} onChange={(e) => update('tx_mm', e.target.value)} /></label>
                  <label>Ty (mm)<input type="number" value={form.ty_mm} onChange={(e) => update('ty_mm', e.target.value)} /></label>
                  <label>Tz (mm)<input type="number" value={form.tz_mm} onChange={(e) => update('tz_mm', e.target.value)} /></label>
                  <label>Rx (°)<input type="number" value={form.rx_deg} onChange={(e) => update('rx_deg', e.target.value)} /></label>
                  <label>Ry (°)<input type="number" value={form.ry_deg} onChange={(e) => update('ry_deg', e.target.value)} /></label>
                  <label>Rz (°)<input type="number" value={form.rz_deg} onChange={(e) => update('rz_deg', e.target.value)} /></label>
                </div>
                <button onClick={submit}>Hitung Rekomendasi Koreksi</button>
              </div>

              <div className={`panel ${activeTab === 'hasil' ? 'active' : ''}`}>
                {result ? (
                  <div className="result">
                    <strong>Risk Score:</strong> {result.risk_score}<br />
                    <strong>Aksi:</strong> {result.action}<br />
                    <strong>Shift (mm):</strong> X {result.recommendation.shift_mm.x}, Y {result.recommendation.shift_mm.y}, Z {result.recommendation.shift_mm.z}<br />
                    <strong>Rotasi (°):</strong> Pitch {result.recommendation.rotation_deg.pitch}, Roll {result.recommendation.rotation_deg.roll}, Yaw {result.recommendation.rotation_deg.yaw}<br />
                    <p className="muted">{result.note}</p>
                  </div>
                ) : (
                  <div className="empty-state">Belum ada hasil. Isi nilai di tab Input lalu klik tombol hitung.</div>
                )}
              </div>

              <div className={`panel ${activeTab === 'info' ? 'active' : ''}`}>
                <div className="result">
                  <strong>Info Aplikasi</strong>
                  <p className="muted">Masukkan parameter translasi (Tx, Ty, Tz) dan rotasi (Rx, Ry, Rz), lalu sistem akan memberikan estimasi risiko dan rekomendasi koreksi setup.</p>
                </div>
              </div>

              <div className="mobile-nav">
                <button className={`nav-btn ${activeTab === 'input' ? 'active' : ''}`} onClick={() => setActiveTab('input')}>Input</button>
                <button className={`nav-btn ${activeTab === 'hasil' ? 'active' : ''}`} onClick={() => setActiveTab('hasil')}>Hasil</button>
                <button className={`nav-btn ${activeTab === 'info' ? 'active' : ''}`} onClick={() => setActiveTab('info')}>Info</button>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
